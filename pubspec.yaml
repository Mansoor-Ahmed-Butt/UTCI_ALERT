name: utci_alert
description: "UTCI Alert — heat-stress alerting app for outdoor workers, delivery riders, and farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / DI / routing
  get: ^4.6.6
  #Utils
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

  # Auth
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Push notifications
  firebase_messaging: ^15.1.3

  # Offline storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0

  # Text-to-speech
  flutter_tts: ^4.2.0

  # Location
  geolocator: ^13.0.1

  # Env config
  flutter_dotenv: ^5.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/

  # App icon configuration (flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
 
#  Splash screen config (flutter_native_splash) 
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/splash_icon.png"
  color_dark: "#1A1A1A"
  image_dark: "assets/icon/splash_icon_dark.png"
 
  android_12:
    image: "assets/icon/splash_icon.png"
    icon_background_color: "#FFFFFF"
    image_dark: "assets/icon/splash_icon_dark.png"
    icon_background_color_dark: "#1A1A1A"
 
  web: false
